c_compiler:           # [osx]
  - clang_bootstrap   # [osx]
cxx_compiler:         # [osx]
  - clang_bootstrap   # [osx]

# libcxx only supports the last released GCC version, see
# https://libcxx.llvm.org/index.html#platform-and-compiler-support
# macOS: self-hosted build with clang_bootstrap 23; see bootstrap_version in meta.yaml
c_compiler_version:
  - 11.2                # [linux]
  - 23                  # [osx]
cxx_compiler_version:
  - 11.2                # [linux]
  - 23                  # [osx]
